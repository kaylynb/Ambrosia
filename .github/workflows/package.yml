name: Package desktop builds

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix (e.g. 0.1.0-rc.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025-vs2026
            platform: windows
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      MISE_ENABLE_TOOLS: cmake,ninja,nushell,github:rhysd/actionlint
      BUILD_VERSION: ${{ inputs.version || format('0.0.0-ci.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
        with:
          cache: false
      - name: Install Linux development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libgl-dev libegl-dev libasound2-dev \
            libpulse-dev libpipewire-0.3-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libudev-dev libdbus-1-dev libibus-1.0-dev libgl1-mesa-dri
      - name: Build, test, and verify the distribution
        shell: nu {0}
        run: nu x.nu package --version $env.BUILD_VERSION --commit $env.GITHUB_SHA
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.platform }}
          path: build/package/artifacts/*
          if-no-files-found: error
          compression-level: 0
