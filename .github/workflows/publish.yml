name: Publish verified desktop builds

# Publishes the archives that the tag's own push built in package.yml, without rebuilding them.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Pushed tag on the default branch whose package build succeeded (e.g. v0.1.0)
        required: true
        type: string

permissions: {}

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify tag, run and archives; publish without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]]
          sha=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$sha" "origin/$DEFAULT_BRANCH" \
            || { echo "$TAG is not on $DEFAULT_BRANCH" >&2; exit 1; }
          # The newest successful package build of the tag's push at the commit it points at now.
          RUN_ID=$(gh api "repos/$GH_REPO/actions/workflows/package.yml/runs?event=push&branch=$TAG&status=success&head_sha=$sha" \
            --jq '.workflow_runs[0].id // empty')
          [[ -n "$RUN_ID" ]] || { echo "no successful package build of $TAG at $sha; wait for it, or rerun it" >&2; exit 1; }
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" | jq -e \
            --arg repo "$GH_REPO" --arg tag "$TAG" --arg sha "$sha" \
            '.path == ".github/workflows/package.yml" and .event == "push"
             and .head_repository.full_name == $repo and .head_branch == $tag
             and .head_sha == $sha and .conclusion == "success"'
          echo "Publishing the archives of run $RUN_ID"
          version=${TAG#v}
          mkdir assets
          cd assets
          gh run download "$RUN_ID" --name desktop-linux --dir .
          gh run download "$RUN_ID" --name desktop-windows --dir .
          assets=()
          for suffix in linux-x64.tar.gz windows-x64.zip windows-x64-symbols.zip; do
            file="ambrosia-$version-$suffix"
            # Check this named file, not an arbitrary path from the checksum file.
            [[ "$(sha256sum "$file")" == "$(cat "$file.sha256")" ]]
            assets+=("$file" "$file.sha256")
          done
          flags=()
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "Ambrosia $version" \
            --generate-notes "${flags[@]}" "${assets[@]}"
