name: Publish verified desktop builds

# Publishes the archives that the tag's own push built in package.yml, without rebuilding them.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Pushed tag on the default branch whose package build succeeded (e.g. v0.1.0)
        required: true
        type: string

permissions: {}

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Find the tag's package build
        id: find
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]]
          sha=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$sha" "origin/$DEFAULT_BRANCH" \
            || { echo "$TAG is not on $DEFAULT_BRANCH" >&2; exit 1; }
          # The newest successful package build of the tag's push at the commit it points at now.
          RUN_ID=$(gh api "repos/$GH_REPO/actions/workflows/package.yml/runs?event=push&branch=$TAG&status=success&head_sha=$sha" \
            --jq '.workflow_runs[0].id // empty')
          [[ -n "$RUN_ID" ]] || { echo "no successful package build of $TAG at $sha; wait for it, or rerun it" >&2; exit 1; }
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" | jq -e \
            --arg repo "$GH_REPO" --arg tag "$TAG" --arg sha "$sha" \
            '.path == ".github/workflows/package.yml" and .event == "push"
             and .head_repository.full_name == $repo and .head_branch == $tag
             and .head_sha == $sha and .conclusion == "success"'
          echo "Publishing the archives of run $RUN_ID"
          { echo "run_id=$RUN_ID"; echo "version=${TAG#v}"; } >> "$GITHUB_OUTPUT"
      # Each archive is an artifact named after its file; a digest mismatch fails the download.
      - name: Download the Linux archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ambrosia-${{ steps.find.outputs.version }}-linux-x64.tar.gz
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}
          path: assets
      # download-artifact extracts a .zip by default, which would publish its contents instead of
      # the archive. Keep each zip whole, in a folder of its own, since the saved name isn't documented.
      - name: Download the Windows archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ambrosia-${{ steps.find.outputs.version }}-windows-x64.zip
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}
          path: zips/windows
          skip-decompress: true
      - name: Download the Windows symbols
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ambrosia-${{ steps.find.outputs.version }}-windows-x64-symbols.zip
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}
          path: zips/symbols
          skip-decompress: true
      # The release page lists assets by file name, so the symbols get a prefix that sorts them
      # after both game archives.
      - name: Name the Windows zips for the release
        shell: bash
        env:
          VERSION: ${{ steps.find.outputs.version }}
        run: |
          set -euo pipefail
          ls -lR zips
          for pair in "windows:ambrosia-$VERSION-windows-x64.zip" "symbols:symbols-ambrosia-$VERSION-windows-x64.zip"; do
            dir="zips/${pair%%:*}"
            mapfile -t found < <(find "$dir" -type f)
            [[ ${#found[@]} -eq 1 ]] || { echo "expected one file in $dir, found ${#found[@]}" >&2; exit 1; }
            unzip -tq "${found[0]}" >/dev/null || { echo "${found[0]} is not a zip archive" >&2; exit 1; }
            mv "${found[0]}" "assets/${pair#*:}"
          done
      # The release lists each asset by its label (file#label) instead of its file name, so the
      # symbols cannot be mistaken for the game; each still downloads under its file name.
      - name: Publish without rebuilding
        shell: bash
        env:
          VERSION: ${{ steps.find.outputs.version }}
        run: |
          set -euo pipefail
          files=("assets/ambrosia-$VERSION-windows-x64.zip" "assets/ambrosia-$VERSION-linux-x64.tar.gz"
            "assets/symbols-ambrosia-$VERSION-windows-x64.zip")
          ls -l "${files[@]}"
          assets=("${files[0]}#Ambrosia $VERSION for Windows (x64)"
            "${files[1]}#Ambrosia $VERSION for Linux (x64)"
            "${files[2]}#Debug symbols - Windows")
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "Ambrosia $VERSION" \
            --generate-notes "${flags[@]}" "${assets[@]}"
